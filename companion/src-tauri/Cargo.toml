[package]
name = "ventured-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
description = "Local-only Board C shortcut Companion"

[lib]
name = "ventured_companion"
path = "src/lib.rs"

[[bin]]
name = "ventured-companion"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
serialport = "=4.8.1"
hidapi = "=2.6.3"
tauri = { version = "=2.11.5", features = [] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.23.0"

[workspace]
